<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#131313",
                        "surface-container": "#201f1f",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#ecb1ff",
                        "primary-container": "#00f0ff",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "outline": "#849495",
                        "inverse-surface": "#e5e2e1",
                        "on-tertiary-container": "#5f5e5e",
                        "surface-container-highest": "#353534",
                        "surface-container-low": "#1c1b1b",
                        "on-surface": "#e5e2e1",
                        "on-secondary-container": "#480063",
                        "on-primary-fixed": "#002022",
                        "on-tertiary-fixed": "#1c1b1b",
                        "on-secondary-fixed-variant": "#75009e",
                        "tertiary-container": "#dcd9d8",
                        "on-secondary": "#520070",
                        "primary": "#dbfcff",
                        "secondary-fixed": "#f9d8ff",
                        "on-primary-fixed-variant": "#004f54",
                        "surface-dim": "#131313",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#474746",
                        "surface-container-high": "#2a2a2a",
                        "secondary": "#ecb1ff",
                        "tertiary-fixed": "#e5e2e1",
                        "surface-bright": "#3a3939",
                        "inverse-on-surface": "#313030",
                        "on-tertiary": "#313030",
                        "error-container": "#93000a",
                        "tertiary": "#f8f5f5",
                        "on-secondary-fixed": "#320046",
                        "surface-tint": "#00dbe9",
                        "on-surface-variant": "#b9cacb",
                        "on-primary-container": "#006970",
                        "outline-variant": "#3b494b",
                        "primary-fixed-dim": "#00dbe9",
                        "surface-container-lowest": "#0e0e0e",
                        "secondary-container": "#d05bff",
                        "on-primary": "#00363a",
                        "primary-fixed": "#7df4ff",
                        "surface-variant": "#353534",
                        "inverse-primary": "#006970",
                        "on-background": "#e5e2e1"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-max": "1200px",
                        "gutter": "24px",
                        "margin-edge": "40px",
                        "timer-gap": "16px"
                    },
                    "fontFamily": {
                        "timer-xl": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "timer-xl": ["120px", { "lineHeight": "120px", "letterSpacing": "-0.05em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400" }],
                        "headline-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #000000;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.1);
        }

        .glow-cyan {
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .time-mesh {
            background-image: radial-gradient(circle at 2px 2px, rgba(0, 240, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
        }

        @keyframes pulse-cyan {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.02);
            }
        }

        .pulse-element {
            animation: pulse-cyan 4s ease-in-out infinite;
        }
    </style>
</head>

<body class="font-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
    <!-- TopNavBar -->

    <!-- Main Content Canvas -->
    <main class="relative min-h-screen flex flex-col items-center justify-center pt-16">
        <!-- Background Animation Layer -->
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div class="time-mesh absolute inset-0 opacity-40"></div>
            <div
                class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container/5 rounded-full blur-[120px]">
            </div>
            <!-- Structural Cube Elements -->
            <div class="absolute inset-0 flex items-center justify-center opacity-20">
                <div class="w-[600px] h-[600px] border border-cyan-400/20 rotate-45 flex items-center justify-center">
                    <div
                        class="w-[400px] h-[400px] border border-cyan-400/30 -rotate-12 flex items-center justify-center">
                        <div class="w-[200px] h-[200px] border border-cyan-400/40 rotate-90"></div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Timer Section -->
        <section class="relative z-10 container-max mx-auto px-margin-edge flex flex-col items-center">
            <div class="flex items-center gap-2 mb-8 group cursor-default">
                <span class="w-2 h-2 bg-primary-container rounded-full animate-pulse"></span>
                <h2 class="font-label-caps text-label-caps text-primary-container uppercase">System Protocol: Active
                    Countdown</h2>
            </div>
            <h1 class="font-headline-lg text-headline-lg text-center mb-16 max-w-3xl text-white">
                Ethglobal ending
            </h1>
            <!-- Massive Timer Cluster -->
            <div class="grid grid-cols-2 md:flex md:flex-row gap-timer-gap items-center justify-center mb-16 pulse-element"
                id="countdown">
                <!-- Days -->
                <div class="flex flex-col items-center">
                    <div
                        class="glass-card glow-cyan rounded-lg px-8 py-10 min-w-[160px] flex items-center justify-center">
                        <span class="font-timer-xl text-timer-xl text-primary-container" id="days">000</span>
                    </div>
                    <span class="font-label-caps text-label-caps text-outline mt-4 uppercase">Days</span>
                </div>
                <div class="hidden md:block font-timer-xl text-timer-xl text-white/20 pb-10">:</div>
                <!-- Hours -->
                <div class="flex flex-col items-center">
                    <div
                        class="glass-card glow-cyan rounded-lg px-8 py-10 min-w-[160px] flex items-center justify-center">
                        <span class="font-timer-xl text-timer-xl text-primary-container" id="hours">00</span>
                    </div>
                    <span class="font-label-caps text-label-caps text-outline mt-4 uppercase">Hours</span>
                </div>
                <div class="hidden md:block font-timer-xl text-timer-xl text-white/20 pb-10">:</div>
                <!-- Minutes -->
                <div class="flex flex-col items-center">
                    <div
                        class="glass-card glow-cyan rounded-lg px-8 py-10 min-w-[160px] flex items-center justify-center">
                        <span class="font-timer-xl text-timer-xl text-primary-container" id="minutes">00</span>
                    </div>
                    <span class="font-label-caps text-label-caps text-outline mt-4 uppercase">Minutes</span>
                </div>
                <div class="hidden md:block font-timer-xl text-timer-xl text-white/20 pb-10">:</div>
                <!-- Seconds -->
                <div class="flex flex-col items-center">
                    <div
                        class="glass-card glow-cyan rounded-lg px-8 py-10 min-w-[160px] flex items-center justify-center">
                        <span class="font-timer-xl text-timer-xl text-primary-container" id="seconds">00</span>
                    </div>
                    <span class="font-label-caps text-label-caps text-outline mt-4 uppercase">Seconds</span>
                </div>
            </div>
            <!-- Action Cluster -->
            <div class="flex flex-col md:flex-row gap-4 w-full max-w-md">
                <button
                    class="flex-1 bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 px-8 rounded hover:brightness-110 transition-all flex items-center justify-center gap-2">
                    SET_NOTIFICATION_ALERT
                    <span class="material-symbols-outlined text-[18px]">notifications_active</span>
                </button>
                <button
                    class="flex-1 border border-primary-container text-primary-container font-label-caps text-label-caps py-4 px-8 rounded hover:bg-primary-container/10 transition-all">
                    VIEW_PROTOCOL_SPECS
                </button>
            </div>
        </section>
    </main>
    <!-- Footer -->
    <footer class="w-full py-8 border-t border-white/5 bg-black">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center px-8 gap-4">
            <div class="text-cyan-400 font-bold font-space-grotesk text-[10px] uppercase tracking-[0.2em]">ETHGLOBAL //
                SYSTEM_RECON</div>
            <div class="flex gap-8">
                <a class="font-space-grotesk text-[10px] uppercase tracking-[0.2em] text-gray-600 hover:text-cyan-300 transition-colors"
                    href="#">Documentation</a>
                <a class="font-space-grotesk text-[10px] uppercase tracking-[0.2em] text-gray-600 hover:text-cyan-300 transition-colors"
                    href="#">Privacy_Protocol</a>
                <a class="font-space-grotesk text-[10px] uppercase tracking-[0.2em] text-gray-600 hover:text-cyan-300 transition-colors"
                    href="#">Network_Status</a>
            </div>
            <div class="font-space-grotesk text-[10px] uppercase tracking-[0.2em] text-gray-600">
                © 2024 ETHGLOBAL // SYSTEM_RECON
            </div>
        </div>
    </footer>
    <!-- Visual Polish: Decorative Scanline -->
    <div class="fixed inset-0 pointer-events-none z-[100] opacity-[0.03]"
        style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%;">
    </div>
    <script>
        const targetTimestamp = 1777745419 * 1000;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetTimestamp - now;

            if (distance < 0) {
                document.getElementById("days").innerText = "0";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>

</html>
